<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ .Title }} - {{ .Site.Title }}</title>

    {{ partial "seo.html" . }}

    <link rel="stylesheet" href="{{ "css/style.css" | relURL }}?v=4">
</head>

<body>

    {{ partial "header.html" . }}

    <div class="tag-page">

        <main>

            <h1>Posts tagged "{{ .Title }}"</h1>

            <p class="tag-intro">
                Posts tagged with "{{ .Title }}".
            </p>

            {{ range .Pages }}

            <article class="tag-post">

                <h2>
                    <a href="{{ .RelPermalink }}">{{ .Title }}</a>
                </h2>

                <p class="meta">
                    Published on {{ .Date.Format "January 2, 2006" }}
                </p>

                <p>
                    {{ .Summary }}
                </p>

                <p class="read-more">
                    <a href="{{ .RelPermalink }}">Read More →</a>
                </p>

            </article>

            {{ end }}

            <p class="tag-back">
                <a href="{{ "/" | relURL }}">← Back to Home</a>
            </p>

        </main>

    </div>

    {{ partial "footer.html" . }}

</body>

</html>
