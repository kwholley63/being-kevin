<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ .Title }} - {{ .Site.Title }}</title>

    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

    {{ partial "header.html" . }}

    <main>

        <article>

            <h1>{{ .Title }}</h1>

            <p class="meta">
                Published on {{ .Date.Format "January 2, 2006" }}
            </p>

            {{ with .Params.tags }}
            <p class="meta">
                Tags:
                {{ range . }}
                    <a href="/tags/{{ . | urlize }}/">{{ . }}</a>
                {{ end }}
            </p>
            {{ end }}

            <div>
                {{ .Content }}
            </div>

        </article>

        <p>
            <a href="/posts/">&larr; Back to Blog</a>
        </p>

    </main>

    {{ partial "footer.html" . }}

</body>

</html>
