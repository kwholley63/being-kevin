<!-- =========================
     SEO Metadata
     ========================= -->

<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}An American guy living the Brazilian way, writing about life in Brazil, books, history, culture, technology, and whatever catches his attention.{{ end }}">

<meta name="author" content="Kevin">

<link rel="canonical" href="{{ .Permalink }}">

<!-- Open Graph -->
<meta property="og:title" content="{{ .Title }}">
<meta property="og:description" content="{{ with .Description }}{{ . }}{{ else }}An American guy living the Brazilian way, writing about life in Brazil, books, history, culture, technology, and whatever catches his attention.{{ end }}">
<meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:site_name" content="{{ .Site.Title }}">

<!-- Twitter / Social Sharing -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ .Title }}">
<meta name="twitter:description" content="{{ with .Description }}{{ . }}{{ else }}An American guy living the Brazilian way, writing about life in Brazil, books, history, culture, technology, and whatever catches his attention.{{ end }}">

<!-- RSS / Feed Discovery -->
{{ with .OutputFormats.Get "RSS" }}
<link rel="alternate" type="application/rss+xml" href="{{ .Permalink }}" title="{{ $.Site.Title }}">
{{ end }}
